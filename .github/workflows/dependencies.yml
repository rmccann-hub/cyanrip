name: Dependencies

# Every Monday, and on demand: names each dependency behind its newest
# release, past a three-day wait, and fails while anything is behind or cannot
# be read, with the list in the run's summary. It runs `skillcheck --outdated`
# from claude-code-skills, pinned to a commit.
#
# The owner's word of 2026-10-19: "are all repos using the most up to date of
# all dependcies, they should. And we need a way to make sure they are. Like
# a weekly repo check". This is the claude-code-skills session's Appendix A of
# that day with two changes. It runs on a named image, as every job here does.
# And it opens no issue: Issues are turned off on this fork, so where
# Appendix A keeps one issue open while anything is behind, the failed run
# carries the list instead, and needs no write permission.
#
# What it cannot see: the runner images, the libraries each job installs
# from its distribution (apt, brew, MSYS2), and the five sources
# .github/mingw-build.sh pins by commit. docs/DEPENDENCIES.md names all
# three; check them by hand when this runs.
#
# Its second job holds the steward skill, .claude/skills/steward/, a draft
# this repository owns, to claude-code-skills' framework with the same pinned
# skillcheck (the owner's word of 2026-11-03).

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # v0.1.21, resolved 2026-10-26 with git ls-remote 'refs/tags/v0.1.21^{}'
  SKILLCHECK: git+https://github.com/rmccann-hub/claude-code-skills@ebc28175ec6532c5c6af4de1ba9a27dbe6984845

jobs:
  outdated:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Measure each dependency against its newest release
        env:
          GITHUB_TOKEN: ${{ github.token }} # raises the API's limit for reading releases
        run: |
          set +e
          uvx --python 3.15 --from "$SKILLCHECK" skillcheck --outdated . > "$RUNNER_TEMP/outdated.txt"
          found=$?
          set -e
          cat "$RUNNER_TEMP/outdated.txt"
          if ! tail -n 1 "$RUNNER_TEMP/outdated.txt" | grep -q '^skillcheck: '; then
            echo "::error::skillcheck --outdated did not finish"
            exit 1
          fi
          {
            echo '```'
            cat "$RUNNER_TEMP/outdated.txt"
            echo '```'
            echo
            echo "Behind: a newer release has been out at least three days. Waiting: one is newer"
            echo "but still inside that wait. Unread: the registry couldn't be read, or the pin"
            echo "names no exact release. Update what's behind, regenerate the dependency map"
            echo "(tools/gen-dependency-map.py), and run this workflow again."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$found" -ne 0 ]; then
            echo "::error::$(tail -n 1 "$RUNNER_TEMP/outdated.txt")"
            exit 1
          fi

  # The steward skill's structure, each fact's quote at its source, and no
  # fact past its check-by date. One finding is expected until the framework
  # gives a repository's own skills a mode of their own: the plugin catalog,
  # which a skill that ships in no plugin has no use for. Measured with this
  # pin on 2026-11-03: that finding alone, and all 11 facts confirmed.
  steward-skill:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Hold the steward skill to its framework
        run: |
          set +e
          uvx --python 3.15 --from "$SKILLCHECK" skillcheck .claude > "$RUNNER_TEMP/check.txt"
          set -e
          cat "$RUNNER_TEMP/check.txt"
          if ! tail -n 1 "$RUNNER_TEMP/check.txt" | grep -q '^skillcheck: '; then
            echo "::error::skillcheck did not finish"
            exit 1
          fi
          if grep -v -e '^skillcheck: ' \
                  -e '^\.claude-plugin/marketplace\.json: catalog: missing' \
                  "$RUNNER_TEMP/check.txt"; then
            echo "::error::the steward skill has a finding beyond the missing catalog"
            exit 1
          fi

      # --due exits 1 when a fact is due, so its list is printed before the
      # step fails on it; --verify prints each quote it no longer finds.
      - name: Each fact still at its source, and none past its check-by date
        run: |
          uvx --python 3.15 --from "$SKILLCHECK" skillcheck .claude --verify
          set +e
          uvx --python 3.15 --from "$SKILLCHECK" skillcheck .claude --due > "$RUNNER_TEMP/due.txt"
          due=$?
          set -e
          cat "$RUNNER_TEMP/due.txt"
          if [ "$due" -ne 0 ]; then
            echo "::error::a fact in the steward skill is past its check-by date"
            exit 1
          fi
