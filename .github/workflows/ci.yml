name: CI (platterpus-fork)

# This file was .github/workflows/main.yml until 2026-10-12. It moved because
# GitHub keys a workflow by its PATH, and `master` -- upstream's copy, never
# committed to -- carries upstream's own main.yml. A push to master (a "Sync
# fork") runs the workflow file in the pushed commit, which is upstream's, so
# the `master` entry this file's push trigger used to carry never did anything,
# and the two files were one workflow that could only be disabled together.
# Under its own path this is a separate workflow, and the inherited one can be
# disabled without touching master.

on:
  push:
    # platterpus-fork is where this fork's work lands and its default branch.
    # The inherited trigger fired only on master and on a `workflow` branch
    # that does not exist, so this fork had CI configured and none running.
    branches: [ platterpus-fork ]
  pull_request:
    branches: [ platterpus-fork ]
  release:
    types: [ released ]
  # A run by hand, from the Actions tab. GitHub offers it only for a workflow
  # on the default branch, which is now platterpus-fork.
  workflow_dispatch:

# Read-only unless a job says otherwise, and only the two upload jobs below do.
permissions:
  contents: read

jobs:
  linux:
    # A release event names a commit this job already tested when it was
    # pushed to platterpus-fork, and the banner is the commit's, not the
    # tag's, so a re-run here tests nothing new. Only mingw-release needs the
    # event, for the binary it attaches.
    if: github.event_name != 'release'
    # Not ubuntu-26.04, unlike the other Linux jobs. The golden reference is
    # generated on Ubuntu 24.04 (libcdio 2.1, libavcodec 60), and its two
    # checks compare a fresh rip only where the library set is the same
    # (tools/gen-golden-reference.py, library_mismatch()). On 26.04 (libcdio
    # 2.2, libavcodec 62) both exit 77, so this suite there checks no
    # reference at all: measured on pull request #50, 131 passed and those
    # two skipped. This moves when the reference's own environment does.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Five configurations, because a configuration nobody builds is a
    # configuration nobody knows the state of -- and that is not theoretical
    # here. `-Ddeclare_released=true` is the build our release manifest tells
    # the consumer to make, nothing had ever compiled it, and when it finally
    # was it failed 2 of 41. The sanitizer rows are the same argument one level
    # down: they pass today, and nothing was running them.
    # `thread` is TSan over the threaded encoder (review C item 3.7). Its
    # options ignore accesses made inside libraries built without it: each
    # of the 70 races TSan reported in this suite without them paired an
    # FFmpeg free or reuse of a frame buffer with swr_convert() reading it,
    # ordered by libavutil's atomic reference count, which TSan cannot see in
    # an uninstrumented library. With them the suite reports none, and a race
    # in this program's own code is still caught.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            opts: ""
          - name: released
            opts: "-Ddeclare_released=true"
          - name: sanitizers
            opts: "-Db_sanitize=address,undefined -Db_lundef=false"
          - name: released+sanitizers
            opts: "-Ddeclare_released=true -Db_sanitize=address,undefined -Db_lundef=false"
          - name: thread
            opts: "-Db_sanitize=thread -Db_lundef=false"
            tsan: "ignore_noninstrumented_modules=1"
    name: linux (${{ matrix.name }})
    steps:
      # One commit, then the whole history of what the suite reads: the
      # handshake record and its commits on platterpus-fork, and upstream's
      # tree at origin/master for `version_matrix`. By explicit refspec, not
      # `fetch-depth: 0`, which fetches every branch and tag, the evidence
      # branch among them (PROTOCOL.md v9 §17, HR-2 8b).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the history the suite reads
        run: .github/fetch-history.sh platterpus-fork master

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config ffmpeg \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
            libswresample-dev libcdio-dev libcdio-cdda-dev libcdio-paranoia-dev \
            libmusicbrainz5-dev libcurl4-openssl-dev libqrencode-dev

      - name: Build
        env:
          OPTS: ${{ matrix.opts }}
        run: |
          meson setup build $OPTS
          ninja -C build

      # GCC's static analyzer over the program this ships (review C item 3.6).
      # Its five warnings at 590e959 were fixed at their source, so a warning
      # now is a new one and fails the step. Ubuntu 24.04's GCC 13, as here.
      - name: Static analysis
        if: matrix.name == 'default'
        run: |
          meson setup build-analyzer -Dc_args=-fanalyzer
          ninja -C build-analyzer src/cyanrip 2>&1 | tee analyzer.log
          if grep -n -e '-Wanalyzer-' analyzer.log; then
            echo "::error::GCC's analyzer reported the findings above"
            exit 1
          fi

      # meson.build's meson_version is the oldest Meson that configures and
      # builds this tree, checked here rather than stated (review C item 3.1:
      # it said 0.53 and the build used 0.55, 0.56 and 0.62). The version is
      # read from meson.build, so moving the floor moves the check. Meson 0.62's
      # python module needs distutils, which Python 3.12 removed, so it runs
      # under uv's Python 3.11. One row is enough: the floor is about Meson.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: matrix.name == 'released'
        with:
          version: "0.13.5"

      - name: Build with the oldest Meson meson.build allows
        if: matrix.name == 'released'
        run: |
          floor=$(sed -n "s/^ *meson_version: '>=\(.*\)',$/\1/p" meson.build)
          test -n "$floor" || { echo "::error::no meson_version in meson.build"; exit 1; }
          uvx --python 3.11 --from "meson==$floor" meson setup build-floor
          ninja -C build-floor

      # tests/valgrind_rip.py rips under Valgrind's memcheck (review C item
      # 3.7) and skips where valgrind is missing, so this row installs it and
      # sets CYANRIP_VALGRIND_REQUIRED, so a missing valgrind fails.
      - name: Install valgrind for the memcheck rip
        if: matrix.name == 'default'
        run: sudo apt-get install -y valgrind

      # tests/python_lint.py runs ruff's Pyflakes rules (review C item 4.3)
      # and skips where ruff is missing, so this row installs it, pinned, and
      # sets CYANRIP_LINT_REQUIRED so a missing ruff fails rather than skips.
      - name: Install ruff for the Python lint
        if: matrix.name == 'released'
        run: |
          uv tool install ruff==0.15.8
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Test
        env:
          CYANRIP_LINT_REQUIRED: ${{ matrix.name == 'released' && '1' || '' }}
          CYANRIP_VALGRIND_REQUIRED: ${{ matrix.name == 'default' && '1' || '' }}
          TSAN_OPTIONS: ${{ matrix.tsan }}
        run: meson test -C build --print-errorlogs

      # Meson prints a test's output only when it fails, so a Settled facts
      # that passes near its 120 s limit says nothing about its slow rows.
      - name: Where Settled facts spent its time
        if: always()
        run: python3 tools/check-settled.py --timing-from build/meson-logs/testlog.json

  # The shell scripts under ShellCheck and the history under gitleaks (review
  # C item 4.3), each from Ubuntu 24.04's own package, the versions this was
  # written against: ShellCheck 0.9.0, and gitleaks 8.16.0, which found
  # nothing in this branch's 1827 commits. The Python tools' lint is in the
  # linux (released) row, where the suite runs it.
  lint:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the history gitleaks reads
        run: .github/fetch-history.sh platterpus-fork

      - name: Install ShellCheck and gitleaks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gitleaks

      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: No secret in the history
        run: gitleaks detect --source . --redact --verbose

  # Each parser of data from outside this program under libFuzzer, with ASan
  # and UBSan, for a minute from its committed seeds (review C item 3.8): the
  # JSON reader, AccurateRip's response and -Y's check of a log. A finding
  # fails the job, and libFuzzer prints the input that found it. Ubuntu
  # 24.04's clang 18, as the session that wrote the harnesses ran them.
  fuzz:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config ffmpeg \
            clang-18 libclang-rt-18-dev \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
            libswresample-dev libcdio-dev libcdio-cdda-dev libcdio-paranoia-dev \
            libmusicbrainz5-dev libcurl4-openssl-dev libqrencode-dev

      - name: Build the fuzz targets
        run: |
          CC=clang-18 meson setup build-fuzz -Dfuzz=true \
            -Db_sanitize=address,undefined -Db_lundef=false
          ninja -C build-fuzz tests/fuzz_json tests/fuzz_accurip tests/fuzz_log

      - name: Fuzz each parser for a minute
        run: |
          for h in json accurip log; do
            mkdir -p "corpus/$h"
            cp tests/fuzz/seeds/$h/* "corpus/$h/"
          done
          cp docs/golden-reference.log corpus/log/
          for h in json accurip log; do
            echo "== $h"
            "./build-fuzz/tests/fuzz_$h" -max_total_time=60 \
              -print_final_stats=1 "corpus/$h"
          done

  macos:
    if: github.event_name != 'release'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the history the suite reads
        run: .github/fetch-history.sh platterpus-fork master

      - name: Install dependencies
        run: |
          brew install meson ninja pkg-config nasm ffmpeg libcdio-paranoia libmusicbrainz curl qrencode

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:$PKG_CONFIG_PATH"
          meson setup build
          ninja -C build

      - name: Test
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix curl)/lib/pkgconfig:$PKG_CONFIG_PATH"
          meson test -C build --print-errorlogs

      # Meson prints a test's output only when it fails, so a Settled facts
      # that passes near its 120 s limit says nothing about its slow rows.
      - name: Where Settled facts spent its time
        if: always()
        run: python3 tools/check-settled.py --timing-from build/meson-logs/testlog.json

  # THE ONE JOB THAT FETCHES THE EVIDENCE BRANCH (PROTOCOL.md v9 §17, HR-2
  # 8a). It checks every manifest row a change adds against its file at its
  # commit, fails if a tag reaches the branch, and runs every check that reads
  # run evidence with CYANRIP_EVIDENCE_REQUIRED=1, so a file it cannot read is
  # a failure here and not an unprobed 77. Before the move there is no evidence
  # branch, the files are in the checkout, and each check runs on them there.
  evidence:
    if: github.event_name != 'release'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A merge's leftover markers, in any tracked text file (review C item
      # 4.5). Seven '<', '>' or '|' at the start of a line, then a space or
      # its end; seven '=' is left out, since Markdown underlines a heading
      # with it.
      - name: No conflict markers
        run: |
          if git grep -n -I -E '^(<{7}|>{7}|[|]{7})( |$)'; then
            echo "::error::conflict markers in the tree, listed above"
            exit 1
          fi

      - name: Fetch the history, the tags and the evidence branch
        run: .github/fetch-history.sh platterpus-fork master --tags --evidence

      # The subject of each commit a change adds (review C item 5.2): at most
      # 72 characters, capitalised, with no full stop. On a pull request, its
      # commits that platterpus-fork lacks; on a push, those the push added.
      # Commits upstream's master holds are left out, being upstream's words.
      - name: Commit subjects
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 tools/check-commit-subjects.py \
              refs/remotes/origin/platterpus-fork HEAD
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python3 tools/check-commit-subjects.py "$BEFORE" HEAD
          else
            echo "UNPROBED: no commit before this push to check from"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config ffmpeg \
            libavcodec-dev libavformat-dev libavfilter-dev libavutil-dev \
            libswresample-dev libcdio-dev libcdio-cdda-dev libcdio-paranoia-dev \
            libmusicbrainz5-dev libcurl4-openssl-dev libqrencode-dev

      - name: Build
        run: |
          meson setup build
          ninja -C build

      # With --current, a removal's moved folders are also compared with the
      # evidence commit (HR-2.1 b) on the default branch as it stands: on a
      # pull request, platterpus-fork as fetched above, which may be newer
      # than the base the event names; on a push, the tip the push replaced.
      - name: Manifest rows against their files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          CYANRIP_EVIDENCE_REQUIRED: "1"
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            CURRENT=$BASE
            if [ "$EVENT" = pull_request ]; then
              CURRENT=refs/remotes/origin/platterpus-fork
            fi
            python3 tools/evidence.py verify-rows --base "$BASE" \
              --current "$CURRENT"
          else
            python3 tools/evidence.py verify-rows
          fi

      - name: No tag reaches the evidence branch
        env:
          CYANRIP_EVIDENCE_REQUIRED: "1"
        run: python3 tools/evidence.py check-tags

      - name: Every check that reads run evidence
        env:
          CYANRIP_EVIDENCE_REQUIRED: "1"
        run: >-
          meson test -C build --print-errorlogs
          'Settled facts' cache_table_matches_the_transcripts
          filed_rig_is_mappable 'No personal details in new evidence'
          'Evidence readers and fixture copies' 'Evidence tool'

      # Meson prints a test's output only when it fails, so a Settled facts
      # that passes near its 120 s limit says nothing about its slow rows.
      - name: Where Settled facts spent its time
        if: always()
        run: python3 tools/check-settled.py --timing-from build/meson-logs/testlog.json

  # Builds curl, neon, libmusicbrainz, libqrencode and FFmpeg from source
  # before cyanrip (.github/mingw-build.sh), hence the longer limit.
  # Runner labels are pinned: ubuntu-26.04, macos-26 (macOS 26, arm64) and
  # windows-2025 (Server 2025 with VS 2026), the newest of each in
  # actions/runner-images' README at 82d1b86, read on 2026-10-20, where
  # ubuntu-latest is still 24.04. The linux job alone stays on ubuntu-24.04,
  # for the golden reference, as its comment says. A -latest label moves to
  # a newer OS over one to two months, so a pinned label changes only when
  # this file does.
  mingw:
    runs-on: windows-2025
    timeout-minutes: 120
    # UCRT64: setup-msys2 marks MINGW64 deprecated. The build script follows
    # $MINGW_PREFIX, so only the environment and the package prefix move.
    env:
      MSYSTEM: UCRT64
    defaults:
       run:
          shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: git base-devel zip autoconf automake libtool mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-libcdio-paranoia mingw-w64-ucrt-x86_64-opus mingw-w64-ucrt-x86_64-lame mingw-w64-ucrt-x86_64-libvorbis mingw-w64-ucrt-x86_64-libxml2 mingw-w64-ucrt-x86_64-nghttp2
          update: true

      # I16: what the six pinned libraries install, cached under the build
      # script's hash, so a pin moved there is a fresh build, and under the
      # MSYS2 packages they were compiled against, which `update: true` moves.
      - name: Name the libraries' cache
        id: libs
        run: |
          echo "packages=$(pacman -Q | grep '^mingw-w64-ucrt-x86_64-' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .github/_install
          key: mingw-libs-${{ hashFiles('.github/mingw-build.sh') }}-${{ steps.libs.outputs.packages }}

      - name: Build
        run: |
          .github/mingw-build.sh
          zip cyanrip cyanrip.exe

      # Until 2026-10-19 this job built cyanrip.exe and nothing ran it, here
      # or anywhere (round 35 lap 3 S11). Its banner, and an info read of a
      # committed disc image, which needs no drive, network or Python.
      - name: Smoke test
        run: |
          ./cyanrip.exe --version | tee version.out
          grep -q 'platterpus-fork' version.out
          ./cyanrip.exe -d tests/fixtures/cdda.nrg -I -N -A -U -P 0

      # The name was `cyanrip-${{ matrix.runs-on }}`, in a job with no matrix,
      # so it came out as `cyanrip-`. The upload jobs below fetch it by name.
      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyanrip-win64
          path: cyanrip.exe

  # The Windows build attached to a published GitHub release. The only job
  # that runs here with write access, and only on a release event.
  mingw-release:
    needs: mingw
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # A release can be published on a tag made in the browser at any commit,
      # and then this is the only job that runs on it. Attach nothing to a
      # commit that is not on platterpus-fork, the only ref a consumer builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse a release whose commit is not on platterpus-fork
        run: |
          .github/fetch-history.sh platterpus-fork
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/platterpus-fork; then
            echo "::error::$GITHUB_SHA, the released commit, is not on platterpus-fork; no binary is attached to it"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyanrip-win64

      - name: Upload the release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp cyanrip.exe cyanrip-win64.exe
          gh release upload "$TAG" cyanrip-win64.exe --repo "$GITHUB_REPOSITORY"

  # Upstream's nightly channel: a release tagged `nightly` in cyanreg/cyanrip,
  # which this fork does not have. Carried from upstream's file and kept
  # upstream's, so it never runs in a fork.
  mingw-nightly:
    needs: mingw
    if: github.repository == 'cyanreg/cyanrip' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyanrip-win64

      - name: Find the nightly release
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" > nightly.json; then
            echo "upload_url=$(jq -r .upload_url nightly.json)" >> "$GITHUB_OUTPUT"
            echo "id=$(jq -r .id nightly.json)" >> "$GITHUB_OUTPUT"
          else
            echo "No release is tagged nightly; nothing to upload."
          fi

      - name: Upload versioned Nightly asset
        if: steps.nightly.outputs.id != ''
        uses: WebFreak001/deploy-nightly@46ecbabd7fad70d3e7d2c97fe8cd54e7a52e215b # v3.2.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.nightly.outputs.upload_url }}
          release_id: ${{ steps.nightly.outputs.id }}
          asset_path: ./cyanrip.exe
          asset_name: cyanrip-win64-$$.exe
          asset_content_type: application/vnd.microsoft.portable-executable
          max_releases: 4

      # mknejp/delete-release-assets did this until 2026-10-20. It publishes
      # no release or tag, so its pin was a branch head no check could call
      # current; gh does the same in two lines, and a missing asset is not an
      # error, as fail-if-no-assets: false made it.
      - name: Delete existing nightly latest
        id: del_nightly_release
        if: steps.nightly.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'cyanrip-win64-latest.exe'; then
            gh release delete-asset nightly cyanrip-win64-latest.exe --repo "$GITHUB_REPOSITORY" --yes
          fi

      - name: Upload latest Nightly asset
        if: steps.del_nightly_release.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp cyanrip.exe cyanrip-win64-latest.exe
          gh release upload nightly cyanrip-win64-latest.exe --repo "$GITHUB_REPOSITORY"
