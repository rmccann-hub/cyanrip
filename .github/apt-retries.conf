// Copied to /etc/apt/apt.conf.d/ by each CI job before its apt-get update.
// A stalled mirror held an install step until the job's own limit (audit of
// 2026-10-27, carried): apt now retries a fetch three times and gives up on
// one that sends nothing for 60 s, and each install step stops at 10 minutes.
Acquire::Retries "3";
Acquire::http::Timeout "60";
Acquire::https::Timeout "60";
